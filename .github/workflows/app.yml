# Builds the macOS app with Xcode for every change of macos/ and publishes it in the "app" release as
# OdooDBManager-<tree of macos/>.zip. install.sh downloads the zip matching its clone, so Macs never
# depend on their own Swift version (Command Line Tools without the SwiftUI macros, Metal…).
name: app

on:
  push:
    branches: [main]
    paths: ["macos/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (universal)
        run: BUILD_ARCHS="arm64 x86_64" bash macos/build.sh "$RUNNER_TEMP/out"
      - name: Package
        run: |
          TREE="$(git rev-parse HEAD:macos)"
          cd "$RUNNER_TEMP/out"
          ditto -c -k --keepParent "Odoo Database Manager.app" "OdooDBManager-$TREE.zip"
          echo "ZIP=$RUNNER_TEMP/out/OdooDBManager-$TREE.zip" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "App builds" --latest=false \
            --notes "Built by the app workflow, downloaded by install.sh (one zip per state of macos/)."
          gh release upload app "$ZIP" --clobber
